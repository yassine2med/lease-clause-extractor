[project]
name = "lease-clause-extractor"
version = "0.1.0"
description = "Extract key dates and amounts from lease text files."
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
